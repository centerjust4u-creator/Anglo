<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anglo Quiz 7 | Center JUST</title>
<style>
:root{--navy:#060e24;--navy2:#0c1a3d;--gold:#d6b158;--gold2:#a8873a;--parch:#f6efdc;--parch2:#ece1c4;--ink:#1c2338;--blue:#2454be;--red:#c63a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:#f4f7fc;background:var(--navy);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 85% -10%,rgba(36,84,190,.32),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(214,177,88,.10),transparent 60%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),var(--navy)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
header.top{text-align:center;padding:6px 0 14px}
header.top img{width:84px;height:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.brand{font-size:22px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px auto 0;max-width:520px}
.screen{display:none}.screen.on{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.intro{text-align:center;padding:14px 4px}
.intro img{width:170px;max-width:55vw;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6))}
.intro .by{margin-top:6px;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.intro h1{font-size:clamp(30px,8vw,46px);margin:18px 0 8px;font-weight:700}
.intro .sub{color:#b9c4de;font-size:17px;line-height:1.5;max-width:460px;margin:0 auto 22px;font-style:italic}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid rgba(214,177,88,.55);background:rgba(214,177,88,.08);padding:8px 16px;border-radius:999px;font-family:system-ui,sans-serif;font-size:14px;color:var(--gold)}
.chip b{color:#fff;font-size:16px}
.btn{font-family:Georgia,serif;font-size:19px;font-weight:700;padding:15px 34px;min-height:54px;border-radius:12px;border:1px solid var(--gold);cursor:pointer;color:#1a1405;background:linear-gradient(180deg,#ecd08a,var(--gold) 55%,var(--gold2));box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--gold);box-shadow:none}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .4s}
.meta{display:flex;justify-content:space-between;font-family:system-ui,sans-serif;font-size:14px;color:#c4cde4;margin-bottom:6px}
.meta b{color:var(--gold)}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border-radius:16px;padding:26px 22px;border:2px solid var(--gold);box-shadow:0 0 0 5px rgba(214,177,88,.15),0 18px 40px rgba(0,0,0,.55)}
.tag{display:inline-block;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7a5f1c;border:1px solid #b9993f;border-radius:999px;padding:3px 12px;margin-bottom:14px}
.qtext{font-size:clamp(19px,4.6vw,24px);line-height:1.45;margin:0 0 20px;font-weight:700}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:12px 14px;font-family:system-ui,sans-serif;font-size:17px;line-height:1.35;color:var(--ink);background:#fffdf6;border:2px solid #cdbb8a;border-radius:12px;cursor:pointer;transition:all .15s}
.opt:hover:not(:disabled){border-color:var(--gold2);transform:translateX(3px);background:#fff8e0}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--navy2);color:var(--gold);font-size:15px}
.opt:disabled{cursor:default}
.opt.correct{background:var(--blue);border-color:#173a85;color:#fff}
.opt.correct .l{background:#fff;color:var(--blue)}
.opt.wrong{background:var(--red);border-color:#8e2323;color:#fff;animation:shake .35s}
.opt.wrong .l{background:#fff;color:var(--red)}
.opt.dim{opacity:.5}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:18px;padding:14px 16px;border-radius:12px;font-family:system-ui,sans-serif;font-size:16px;line-height:1.5}
.fb.show{display:block;animation:fade .3s}
.fb.ok{background:rgba(36,84,190,.12);border-left:5px solid var(--blue)}
.fb.no{background:rgba(198,58,58,.1);border-left:5px solid var(--red)}
.fb strong{display:block;font-family:Georgia,serif;font-size:18px;margin-bottom:2px}
.nx{display:flex;justify-content:flex-end;margin-top:18px}
.nx .btn{display:none}.nx .btn.show{display:inline-block}
.res{text-align:center;padding:10px 0}
.res img{width:110px}
.res h2{font-size:30px;margin:10px 0 4px;color:var(--gold)}
.score{font-size:68px;font-weight:700;color:var(--gold);line-height:1.1;margin:10px 0 0}
.pct{font-family:system-ui,sans-serif;color:#c4cde4;font-size:18px;margin:4px 0 12px}
.msg{font-style:italic;color:#d9e0f2;font-size:18px;margin-bottom:24px}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7f8bab;margin-top:32px}
@media(max-width:520px){.card{padding:20px 15px}.brand{font-size:18px}.btn{width:100%}.nx .btn{width:100%}}
</style></head>

<script>
var QUESTIONS=[{"t": "tf", "q": "The case of Marbury v. Madison was decided by the U.S. Supreme Court in 1803.", "a": true, "e": "The decision in Marbury v. Madison was handed down in 1803."}, {"t": "tf", "q": "The doctrine of judicial review allows the Supreme Court to invalidate laws that contradict the Constitution.", "a": true, "e": "Judicial review is precisely the power to strike down laws that conflict with the Constitution."}, {"t": "tf", "q": "Thomas Jefferson was defeated by John Adams in the presidential election of 1800.", "a": false, "e": "It was the other way around: Jefferson won the 1800 election and Adams was the defeated incumbent."}, {"t": "tf", "q": "William Marbury was appointed as a justice of the peace for the District of Columbia.", "a": true, "e": "Marbury's appointment was as a justice of the peace for the District of Columbia."}, {"t": "tf", "q": "James Madison was the Secretary of State under President John Adams when he refused to deliver Marbury's commission.", "a": false, "e": "Madison served as Secretary of State under President Jefferson, the new president, not under Adams."}, {"t": "tf", "q": "The Judiciary Act of 1801 created new courts and increased the number of federal judges.", "a": true, "e": "The 1801 Act expanded the federal judiciary with new courts and additional judges."}, {"t": "tf", "q": "John Adams appointed 16 new circuit judges and 42 new justices of the peace during his final days in office.", "a": true, "e": "In his last days in office Adams filled 16 new circuit judgeships and 42 justice-of-the-peace posts."}, {"t": "tf", "q": "Marbury requested a writ of mandamus to compel Madison to deliver his appointment commission.", "a": true, "e": "A writ of mandamus is a court order compelling an official to perform a duty, which is what Marbury sought."}, {"t": "tf", "q": "The Supreme Court ruled that Marbury had no legal right to receive his appointment commission.", "a": false, "e": "The Court recognized that Marbury did have a right to his commission."}, {"t": "tf", "q": "The Supreme Court concluded that it had the constitutional authority to compel Madison to deliver Marbury's commission.", "a": false, "e": "The Court concluded it lacked the authority to issue the writ, because the law granting that power conflicted with the Constitution."}, {"t": "tf", "q": "Section 13 of the Judiciary Act of 1789 was declared unconstitutional because it conflicted with Article III of the Constitution.", "a": true, "e": "Section 13 tried to give the Court a power beyond what Article III allows, so it was struck down."}, {"t": "tf", "q": "Chief Justice Marshall concluded that Congress could expand the Supreme Court's original jurisdiction beyond the limits established by the Constitution.", "a": false, "e": "Marshall held that Congress cannot enlarge the Court's original jurisdiction beyond the limits set by the Constitution."}, {"t": "tf", "q": "The principle of constitutional supremacy means that federal legislation has greater legal authority than the Constitution.", "a": false, "e": "Constitutional supremacy means the Constitution outranks ordinary legislation, not the reverse."}, {"t": "tf", "q": "The Supreme Court's decision demonstrated that the judiciary could intervene when Congress enacted legislation that violated the Constitution.", "a": true, "e": "The ruling showed that courts may step in when Congress passes unconstitutional legislation."}, {"t": "tf", "q": "The principle of separation of powers prevents the judiciary from reviewing the constitutionality of legislation enacted by Congress.", "a": false, "e": "Judicial review actually supports separation of powers by letting the judiciary restrain legislative power."}, {"t": "mc", "q": "What is the main constitutional principle established by Marbury v. Madison?", "o": ["Parliamentary sovereignty", "Judicial review", "Presidential immunity", "Federal supremacy over state governments"], "a": 1, "e": "Marbury v. Madison established judicial review."}, {"t": "mc", "q": "Who won the presidential election of 1800?", "o": ["John Adams", "James Madison", "Thomas Jefferson", "John Marshall"], "a": 2, "e": "Thomas Jefferson won the 1800 election, defeating Adams."}, {"t": "mc", "q": "What position was William Marbury appointed to?", "o": ["Secretary of State", "Justice of the peace", "Chief Justice of the Supreme Court", "Circuit court prosecutor"], "a": 1, "e": "Marbury was appointed a justice of the peace for the District of Columbia."}, {"t": "mc", "q": "Why did John Adams appoint additional federal judges during his final days in office?", "o": ["To reduce the authority of the judiciary", "To strengthen Federalist influence in federal institutions", "To transfer judicial authority to Congress", "To eliminate the Supreme Court's jurisdiction"], "a": 1, "e": "The late appointments were meant to strengthen Federalist influence in federal institutions."}, {"t": "mc", "q": "How many new circuit judges did John Adams appoint during his final days in office?", "o": ["12", "16", "24", "42"], "a": 1, "e": "Adams appointed 16 new circuit judges (and 42 justices of the peace)."}, {"t": "mc", "q": "Why did James Madison refuse to deliver Marbury's commission?", "o": ["Because Marbury had resigned from his position", "Because the Senate had rejected Marbury's appointment", "Because Adams was considered to have acted in bad faith to serve his party's interests", "Because the Supreme Court had already cancelled the appointment"], "a": 2, "e": "Adams's last-minute appointments were regarded as bad faith serving his party's interests."}, {"t": "mc", "q": "What legal remedy did Marbury request from the Supreme Court?", "o": ["A writ of habeas corpus", "A writ of mandamus", "An injunction against Congress", "A declaration of presidential immunity"], "a": 1, "e": "Marbury asked for a writ of mandamus to compel delivery of his commission."}, {"t": "mc", "q": "Which provision of the U.S. Constitution was central to Chief Justice Marshall's analysis?", "o": ["Article I", "Article II", "Article III", "Article IV"], "a": 2, "e": "Marshall's analysis turned on Article III, which defines the Supreme Court's jurisdiction."}, {"t": "mc", "q": "What did the Supreme Court decide regarding Marbury's right to receive his commission?", "o": ["He had no right because Jefferson opposed his appointment", "He had a right to receive his commission", "His right depended on a new congressional vote", "His appointment was automatically cancelled after the election"], "a": 1, "e": "The Court recognized that Marbury had a right to his commission."}, {"t": "mc", "q": "Why could the Supreme Court not issue the requested writ of mandamus?", "o": ["Because Marbury had failed to establish a legal right", "Because Madison was legally immune from all judicial proceedings", "Because the statutory provision granting that authority conflicted with the Constitution", "Because the President had exclusive authority to interpret the Constitution"], "a": 2, "e": "The statute that granted the Court this power conflicted with the Constitution, so it could not be applied."}, {"t": "mc", "q": "Which section of the Judiciary Act of 1789 was declared unconstitutional?", "o": ["Section 5", "Section 10", "Section 13", "Section 20"], "a": 2, "e": "Section 13 was the provision declared unconstitutional."}, {"t": "mc", "q": "According to the principle of constitutional supremacy, what happens when an ordinary federal law contradicts the Constitution?", "o": ["The federal law automatically amends the Constitution", "The federal law remains valid until the President rejects it", "The conflicting law is considered null and void", "The Constitution becomes temporarily inapplicable"], "a": 2, "e": "Because the Constitution is supreme, a contradicting ordinary law is null and void."}, {"t": "mc", "q": "Which statement best explains Chief Justice Marshall's reasoning concerning the Supreme Court's original jurisdiction?", "o": ["Congress may freely expand original jurisdiction through ordinary legislation", "The President determines the limits of original jurisdiction", "Article III establishes constitutional limits that ordinary legislation cannot override", "The Supreme Court has unlimited original jurisdiction over disputes involving federal officials"], "a": 2, "e": "Original jurisdiction is limited by Article III, and ordinary legislation cannot override those limits."}, {"t": "mc", "q": "How does judicial review support the principle of separation of powers?", "o": ["By allowing the judiciary to replace Congress in making legislation", "By permitting the judiciary to invalidate unconstitutional legislation and restrain legislative power", "By giving the President final authority over constitutional interpretation", "By preventing courts from examining legislative decisions"], "a": 1, "e": "Judicial review lets the judiciary invalidate unconstitutional laws, which restrains legislative power."}, {"t": "mc", "q": "Which of the following best describes the constitutional significance of the Supreme Court's decision in Marbury v. Madison?", "o": ["The Court established that presidential decisions are always superior to congressional legislation", "The Court recognized Marbury's right but refused relief because the statutory grant of jurisdiction was unconstitutional, thereby establishing judicial review", "The Court rejected Marbury's appointment and confirmed that Congress has unlimited judicial authority", "The Court ordered Madison to deliver the commission and declared Article III unconstitutional"], "a": 1, "e": "The Court recognized the right, denied relief because the jurisdiction statute was unconstitutional, and thereby established judicial review."}];
(function(){
function $(i){return document.getElementById(i)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var total=QUESTIONS.length,tf=0,mc=0;QUESTIONS.forEach(function(q){q.t==='tf'?tf++:mc++});
$('nTotal').textContent=total;$('nTF').textContent=tf;$('nMC').textContent=mc;
var order=[],idx=0,score=0,locked=false;
function show(id){['s-intro','s-quiz','s-res'].forEach(function(s){$(s).classList.toggle('on',s===id)});
 var h=id!=='s-intro';['hlogo','hbrand','hrule'].forEach(function(x){$(x).style.display=h?'':'none'});window.scrollTo(0,0)}
function start(){order=shuffle(QUESTIONS);idx=0;score=0;$('sc').textContent=0;show('s-quiz');render()}
function render(){
 var q=order[idx];locked=false;
 $('prog').textContent='Question '+(idx+1)+' of '+total;
 $('barfill').style.width=(idx/total*100)+'%';
 $('qtag').textContent=q.t==='tf'?'True / False':'Multiple Choice';
 $('qtext').textContent=q.q;
 var items;
 if(q.t==='tf'){items=[{text:'True',ok:q.a===true},{text:'False',ok:q.a===false}]}
 else{items=shuffle(q.o.map(function(t,i){return{text:t,ok:i===q.a}}))}
 var box=$('opts');box.innerHTML='';
 items.forEach(function(it,i){
  var b=document.createElement('button');b.type='button';b.className='opt';
  var l=document.createElement('span');l.className='l';l.textContent=q.t==='tf'?(it.text==='True'?'T':'F'):'ABCD'.charAt(i);
  var s=document.createElement('span');s.textContent=it.text;
  b.appendChild(l);b.appendChild(s);b._ok=it.ok;
  b.addEventListener('click',function(){answer(b,q)});box.appendChild(b)});
 $('fb').className='fb';$('fb').innerHTML='';$('next').className='btn';
 $('next').textContent=idx===total-1?'See results':'Next question'}
function answer(btn,q){
 if(locked)return;locked=true;
 var all=$('opts').children,right=btn._ok;
 for(var i=0;i<all.length;i++){var o=all[i];o.disabled=true;
  if(o._ok)o.classList.add('correct');else if(o===btn)o.classList.add('wrong');else o.classList.add('dim')}
 if(right){score++;$('sc').textContent=score}
 var f=$('fb');f.className='fb show '+(right?'ok':'no');
 f.innerHTML='';var st=document.createElement('strong');st.textContent=right?'Correct!':'Incorrect';
 var p=document.createElement('span');p.textContent=q.e;f.appendChild(st);f.appendChild(p);
 $('barfill').style.width=((idx+1)/total*100)+'%';
 $('next').className='btn show'}
$('next').addEventListener('click',function(){if(!locked)return;idx++;if(idx>=total)finish();else render()});
function finish(){
 var pc=Math.round(score/total*100);
 $('fs').textContent=score+' / '+total;$('fp').textContent=pc+'%';
 $('fm').textContent=pc>=90?'Outstanding work!':pc>=70?'Well done!':pc>=50?'Good effort, keep practicing.':'Keep studying and try again.';
 show('s-res')}
$('start').addEventListener('click',start);$('restart').addEventListener('click',start);
})();
</script></body></html>
