<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anglo Quiz 9 | Center JUST</title>
<style>
:root{--navy:#060E24;--gold:#D6B158;--gold2:#a98a3c;--text:#F4F7FC;--muted:#A9B6D3;--blue:#2f6fe0;--red:#DE4040;--parch:#F6EFDD;--ink:#1c2236}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 90% -5%,rgba(36,84,190,.35),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(214,177,88,.08),transparent 60%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),var(--navy)}
.wrap{max-width:780px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:6px 0 12px;border-bottom:1px solid var(--gold)}
header img{width:44px;height:44px;object-fit:contain}
header .brand{font-family:Georgia,"Times New Roman",serif;font-size:1.25rem;letter-spacing:.06em;color:var(--gold)}
header .tag{margin-left:auto;font-size:.72rem;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.bar{height:4px;background:rgba(255,255,255,.08);margin-top:3px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .4s}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:22px}
.screen{display:none;animation:rise .45s ease}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.center{text-align:center}
.logo-big{width:190px;max-width:55vw;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5))}
.wm{font-family:Georgia,serif;color:var(--gold);letter-spacing:.3em;font-size:1.15rem;margin:6px 0 18px;text-transform:uppercase}
h1{font-family:Georgia,serif;font-weight:700;font-size:clamp(2rem,7vw,3rem);color:var(--text)}
.rule{width:80px;height:2px;background:var(--gold);margin:14px auto}
.sub{color:var(--muted);max-width:520px;margin:0 auto 22px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid rgba(214,177,88,.5);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 16px;font-size:.9rem;color:var(--gold)}
.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 34px;font-weight:700;font-size:1.05rem;letter-spacing:.04em;color:#1a1405;background:linear-gradient(180deg,#e8c973,var(--gold) 60%,var(--gold2));box-shadow:0 6px 20px rgba(214,177,88,.25);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(214,177,88,.35)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.stats{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:.95rem;color:var(--muted)}
.stats b{color:var(--gold)}
.score{border:1px solid rgba(214,177,88,.5);border-radius:999px;padding:3px 14px;color:var(--text)}
.card{background:var(--parch);color:var(--ink);border-radius:16px;padding:26px 22px;box-shadow:0 14px 40px rgba(0,0,0,.5);border-top:5px solid var(--gold)}
.type{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#8a6b1f;font-weight:700;margin-bottom:8px}
.q{font-family:Georgia,serif;font-size:clamp(1.15rem,3.6vw,1.45rem);line-height:1.45;margin-bottom:20px}
.opts{display:grid;gap:11px}
.opt{font:inherit;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:center;width:100%;min-height:56px;padding:12px 14px;border-radius:12px;border:2px solid #d9cfb4;background:#fffaf0;color:var(--ink);transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--gold2);transform:translateX(4px);background:#fff4d8}
.opt .l{flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-family:Georgia,serif}
.opt:disabled{cursor:default;color:var(--ink)}.opt.correct:disabled,.opt.wrong:disabled{color:#fff}
.opt.correct{background:var(--blue);border-color:#1e4fb0;color:#fff;animation:pop .35s}
.opt.correct .l{background:#fff;color:var(--blue)}
.opt.wrong{background:var(--red);border-color:#a82a2a;color:#fff;animation:shake .35s}
.opt.wrong .l{background:#fff;color:var(--red)}
.opt.dim{opacity:.5}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:18px;border-radius:12px;padding:14px 16px;font-size:.98rem}
.fb.on{display:block;animation:rise .3s}
.fb.ok{background:rgba(47,111,224,.12);border-left:5px solid var(--blue)}
.fb.no{background:rgba(222,64,64,.1);border-left:5px solid var(--red)}
.fb strong{display:block;font-family:Georgia,serif;font-size:1.1rem;margin-bottom:3px}
.nextrow{display:none;justify-content:flex-end;margin-top:18px}
.nextrow.on{display:flex}
.big{font-family:Georgia,serif;font-size:clamp(4rem,18vw,6.5rem);color:var(--gold);line-height:1;text-shadow:0 0 30px rgba(214,177,88,.3)}
.res-line{font-size:1.2rem;margin:8px 0}
.msg{color:var(--muted);margin:10px auto 26px;max-width:480px}
footer{text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.08em;padding-top:26px}
footer span{color:var(--gold)}
@media(max-width:520px){.wrap{padding:12px 12px 30px}.card{padding:20px 15px}header .tag{font-size:.62rem;letter-spacing:.12em}}
</style>
</head>

var BANK = [{"t": "tf", "q": "Libel refers to written defamation, while slander refers to spoken defamation.", "a": true, "e": "Libel is written defamation and slander is spoken defamation."}, {"t": "tf", "q": "Public officials enjoy greater protection against criticism than ordinary citizens because of their governmental positions.", "a": false, "e": "Public officials are expected to tolerate greater criticism than private individuals, because they voluntarily enter public life and face greater public scrutiny."}, {"t": "tf", "q": "Under the actual malice standard, a public official must prove that the publisher knew a statement was false or acted with reckless disregard for its truth.", "a": true, "e": "Actual malice requires proof of knowledge of falsity or reckless disregard for the truth."}, {"t": "tf", "q": "In New York Times Co. v. Sullivan (1964), the U.S. Supreme Court upheld the Alabama courts' decision to award damages to Sullivan.", "a": false, "e": "The Supreme Court did not uphold the award. The case turned on whether the First Amendment protected newspapers against defamation claims by public officials over inaccurate statements."}, {"t": "tf", "q": "Truthful commercial speech generally receives First Amendment protection, while misleading or fraudulent commercial speech may be restricted.", "a": true, "e": "Truthful commercial speech is generally protected; misleading or fraudulent commercial speech may be restricted."}, {"t": "tf", "q": "A government regulation of truthful commercial speech is constitutional whenever it serves any legitimate governmental purpose, regardless of how broadly it is written.", "a": false, "e": "A valid regulation must serve a substantial governmental interest, directly advance it, and be narrowly tailored. A merely legitimate purpose and a broad rule are not enough."}, {"t": "tf", "q": "Prior restraints generally prevent expression before publication rather than imposing punishment after publication.", "a": true, "e": "A prior restraint operates before publication, rather than punishing after it."}, {"t": "tf", "q": "The government bears a heavy burden when attempting to justify a prior restraint on publication.", "a": true, "e": "Prior restraints face a heavy burden of justification; only a narrowly tailored restraint protecting an interest of the highest order may succeed."}, {"t": "tf", "q": "Large-scale seizures of allegedly obscene books may occur without a prior judicial determination of obscenity.", "a": false, "e": "Authorities must generally first hold a full adversary hearing and obtain a judicial determination of obscenity."}, {"t": "tf", "q": "The First Amendment gives journalists an unrestricted right to interview any prisoner they choose.", "a": false, "e": "Journalists do not have an absolute, unrestricted right of access to prisoners or prison facilities."}, {"t": "tf", "q": "Broadcasting may be subjected to stricter governmental regulation than internet communications.", "a": true, "e": "Broadcasting can be regulated more strictly than internet communications, given the right of viewers and listeners to receive information."}, {"t": "tf", "q": "The Free Exercise Clause generally prevents the government from enforcing neutral laws regulating conduct whenever those laws conflict with religious practices.", "a": false, "e": "A generally applicable law regulating conduct may be enforced if it was not specifically designed to interfere with religion, even when it affects religious practices."}, {"t": "tf", "q": "A law specifically prohibiting an animal-slaughter practice associated with a particular religious sect may violate the Free Exercise Clause.", "a": true, "e": "A law aimed specifically at a religious sect's practice, rather than at general conduct, may violate the Free Exercise Clause."}, {"t": "tf", "q": "Under the Lemon Test, a law may remain constitutional even if it creates excessive governmental entanglement with religion, provided that it has a secular purpose.", "a": false, "e": "A secular purpose alone is not enough. Excessive governmental entanglement with religion makes a program unconstitutional under the Lemon Test."}, {"t": "tf", "q": "A public school that allows outside organizations to use its facilities after school hours may exclude religious organizations solely because they intend to discuss religious matters.", "a": false, "e": "Religious organizations may not be excluded solely because they intend to discuss religious matters."}, {"t": "mc", "q": "Which of the following best defines slander?", "o": ["Written criticism of governmental policies", "Spoken defamation", "Publication of confidential governmental information", "False commercial advertising"], "a": 1, "e": "Slander is spoken defamation; libel is the written form."}, {"t": "mc", "q": "Why are public officials expected to tolerate greater criticism than private individuals?", "o": ["They have no legal right to protect their reputations.", "They are automatically immune from all defamation claims.", "They voluntarily enter public life and are subject to greater public scrutiny.", "They cannot bring lawsuits against journalists."], "a": 2, "e": "Public officials voluntarily enter public life and are subject to greater public scrutiny."}, {"t": "mc", "q": "A journalist publishes an inaccurate statement about a public official after relying on a source believed to be reliable. The journalist neither knew the statement was false nor recklessly disregarded its truth. Which principle most directly protects the journalist?", "o": ["The Establishment Clause", "The actual malice standard", "The Lemon Test", "The doctrine of prior restraint"], "a": 1, "e": "A public official must show the publisher knew the statement was false or recklessly disregarded its truth. Neither occurred here."}, {"t": "mc", "q": "What was the central constitutional issue in New York Times Co. v. Sullivan (1964)?", "o": ["Whether newspapers could be prohibited from criticizing private businesses", "Whether freedom of religion extended to public officials", "Whether the First Amendment protected newspapers against defamation claims brought by public officials concerning inaccurate statements", "Whether newspapers were exempt from taxation"], "a": 2, "e": "The case concerned First Amendment protection for newspapers against defamation claims by public officials over inaccurate statements."}, {"t": "mc", "q": "Which of the following is NOT a requirement for a valid governmental regulation of protected commercial speech?", "o": ["The regulation must serve a substantial governmental interest.", "The regulation must directly advance that interest.", "The regulation must be narrowly tailored to serve that interest.", "The regulation must completely eliminate all commercial advertising."], "a": 3, "e": "A valid regulation must serve a substantial interest, directly advance it, and be narrowly tailored. Eliminating all commercial advertising is not required."}, {"t": "mc", "q": "A newspaper obtains classified information revealing the exact timing of an imminent military operation. Publication would expose soldiers to serious danger. Which of the following best describes the government's ability to prevent publication?", "o": ["Publication can never be restricted under any circumstances.", "The government may impose a narrowly tailored prior restraint to protect an interest of the highest order.", "The government may prohibit all future publications by the newspaper.", "The newspaper automatically loses all First Amendment protections."], "a": 1, "e": "The government bears a heavy burden, but a narrowly tailored prior restraint may protect an interest of the highest order."}, {"t": "mc", "q": "Which procedural safeguard is required for a valid system of prior restraint?", "o": ["Government officials may delay judicial review indefinitely.", "Restrictions may be based on vague and undefined standards.", "There must be a prompt and final determination of the restraint's validity.", "Publishers must prove that all their future publications will be accurate."], "a": 2, "e": "A valid system of prior restraint requires a prompt and final determination of the restraint's validity."}, {"t": "mc", "q": "Before conducting a large-scale seizure of allegedly obscene publications, authorities must generally obtain:", "o": ["Approval from the newspaper's editor", "A full adversary hearing and a judicial determination of obscenity", "Permission from the local broadcasting authority", "A written complaint from any member of the public"], "a": 1, "e": "Large-scale seizures require a full adversary hearing and a judicial determination of obscenity first."}, {"t": "mc", "q": "Which statement concerning the constitutional rights of journalists is correct?", "o": ["Journalists are exempt from all general business taxes.", "Journalists have an absolute right to inspect prison facilities.", "Journalists may be required to testify before grand juries.", "Journalists possess greater First Amendment freedoms than ordinary citizens in every situation."], "a": 2, "e": "Journalists may be required to testify before grand juries; their rights are not absolute or greater than others' in every situation."}, {"t": "mc", "q": "What is the primary consideration underlying the regulation of radio and television broadcasting?", "o": ["The financial interests of broadcasting companies", "The right of broadcasters to transmit anything they choose", "The right of viewers and listeners to receive information", "The right of newspapers to control broadcasting stations"], "a": 2, "e": "Broadcast regulation rests primarily on the right of viewers and listeners to receive information."}, {"t": "mc", "q": "Which constitutional amendment makes the First Amendment's religious freedom protections applicable to state governments?", "o": ["The Fifth Amendment", "The Tenth Amendment", "The Fourteenth Amendment", "The Twenty-First Amendment"], "a": 2, "e": "The Fourteenth Amendment applies the First Amendment's religious freedom protections to the states."}, {"t": "mc", "q": "A state adopts a generally applicable law prohibiting the use of a particular drug. A religious group argues that the drug is essential to its ceremonies. Under the general conduct regulation principle, which outcome is most appropriate?", "o": ["The law is automatically unconstitutional because it affects religious practices.", "The law may be enforced if it regulates general conduct and was not specifically designed to interfere with religion.", "The religious group must automatically receive governmental funding.", "The government must recognize the group's religion as an official state religion."], "a": 1, "e": "A general conduct law may be enforced if it was not specifically designed to interfere with religion."}, {"t": "mc", "q": "A government provides financial assistance exclusively to schools belonging to one religious sect while denying equivalent assistance to other religious schools. Which constitutional principle is most directly implicated?", "o": ["The prohibition against prior restraint", "The actual malice standard", "The Establishment Clause's restriction on religious preference", "The constitutional protection of commercial speech"], "a": 2, "e": "Favoring one religious sect over others implicates the Establishment Clause's restriction on religious preference."}, {"t": "mc", "q": "A facially neutral government program provides educational assistance to religious and nonreligious institutions. The program has a secular purpose and a neutral primary effect, but requires continuous governmental supervision of religious instruction. Under the Lemon Test, what is the most appropriate conclusion?", "o": ["The program is constitutional because it satisfies two of the three requirements.", "The program is unconstitutional because it creates excessive governmental entanglement with religion.", "The program is automatically constitutional because religious institutions receive assistance.", "The program is constitutional as long as the government considers education important."], "a": 1, "e": "Continuous governmental supervision of religious instruction creates excessive entanglement, which makes the program unconstitutional under the Lemon Test."}, {"t": "mc", "q": "Which of the following government assistance programs is most likely to satisfy the constitutional principles governing aid to religious institutions?", "o": ["A program providing public funds exclusively for religious instruction", "A program allocating assistance according to the religious beliefs of applicants", "A program providing assistance to a defined class of beneficiaries without reference to religion", "A program requiring public schools to organize compulsory religious ceremonies"], "a": 2, "e": "Assistance to a defined class of beneficiaries without reference to religion is the program most likely to satisfy the principles."}];

  if(it.ok){right++;fb.className="fb on ok";fb.innerHTML="<strong>Correct!</strong>"}
  else{btn.classList.add("wrong");var c=list.filter(function(x){return x.ok})[0];fb.className="fb on no";fb.innerHTML="<strong>Incorrect</strong><span class='ca'></span>";fb.querySelector(".ca").textContent="Correct answer: "+c.txt+". "}
  var ex=document.createElement("span");ex.textContent=q.e;fb.appendChild(ex);
  $("run").textContent=right+" correct";
  $("bar").style.width=((idx+1)/order.length*100)+"%";
  $("nr").className="nextrow on";
 }
 function nextQ(){
  if(!answered)return;
  idx++;
  if(idx>=order.length)finish();else render();
 }
 function finish(){
  var n=order.length,p=Math.round(right/n*100);
  $("pct").textContent=p+"%";
  $("fin").textContent=right+" / "+n+" correct";
  $("msg").textContent=p>=90?"Outstanding work!":p>=70?"Well done. You have a solid grasp of the material.":p>=50?"A good start. Review and try again to improve.":"Keep practicing. Restart the quiz and try again.";
  $("bar").style.width="100%";
  show("s-end");
 }
 $("start").addEventListener("click",start);
 $("next").addEventListener("click",nextQ);
 $("restart").addEventListener("click",function(){$("bar").style.width="0";start()});
 document.addEventListener("keydown",function(e){
  if(!$("s-quiz").classList.contains("on"))return;
  if(e.key==="Enter"&&answered){e.preventDefault();nextQ();return}
  var k=e.key.toLowerCase(),q=order[idx];
  if(answered||!q)return;
  var m={a:0,b:1,c:2,d:3};
  if(q.t==="tf"){var i=k==="t"||k==="a"?0:k==="f"||k==="b"?1:-1;if(i>=0)$("opts").children[i].click()}
  else if(k in m&&$("opts").children[m[k]])$("opts").children[m[k]].click();
 });
})();
</script>
</body>
</html>
