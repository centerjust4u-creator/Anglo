<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anglo Quiz 5 | Center JUST</title>
<style>
:root{--navy:#0a1226;--navy2:#111d3b;--gold:#c9a24a;--gold2:#e6c878;--parch:#f6efdc;--parch2:#eadfc3;--ink:#1d2236;--blue:#1f4fb5;--bluebg:#dbe6ff;--red:#b3261e;--redbg:#fbdcd8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Georgia,"Times New Roman",serif;color:var(--parch);background:radial-gradient(ellipse at top,#16254a 0%,var(--navy) 60%,#050913 100%);display:flex;justify-content:center;padding:18px 14px 40px}
.wrap{width:100%;max-width:760px}
.screen{display:none;animation:rise .5s ease}
.screen.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.brand{text-align:center;margin-bottom:18px}
.brand img{width:130px;height:130px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 5px rgba(201,162,74,.2),0 10px 30px rgba(0,0,0,.6);background:#000}
.brand .name{margin-top:10px;font-size:1.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);font-weight:bold}
.brand.small img{width:64px;height:64px;border-width:2px;box-shadow:none}
.brand.small .name{font-size:.95rem;margin-top:4px}
.rule{height:2px;width:120px;margin:12px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border-radius:16px;border:2px solid var(--gold);box-shadow:0 14px 40px rgba(0,0,0,.55),inset 0 0 0 4px rgba(201,162,74,.18);padding:26px 22px}
h1{font-size:2rem;text-align:center;color:var(--navy);letter-spacing:.03em}
.sub{text-align:center;margin-top:10px;font-style:italic;color:#4a4f66;font-size:1.05rem}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 6px}
.chip{background:var(--navy);color:var(--gold2);border:1px solid var(--gold);border-radius:999px;padding:7px 16px;font-size:.95rem}
.btn{display:block;width:100%;margin-top:22px;padding:16px;font:bold 1.1rem Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);background:linear-gradient(180deg,var(--gold2),var(--gold));border:none;border-radius:12px;cursor:pointer;box-shadow:0 5px 0 #8c6d27,0 10px 18px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8c6d27}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--gold2);font-size:1rem}
.score-pill{background:var(--navy2);border:1px solid var(--gold);border-radius:999px;padding:5px 14px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:16px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s}
.qtype{display:inline-block;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#7a5f1f;border:1px solid var(--gold);border-radius:6px;padding:3px 9px;margin-bottom:12px}
.qtext{font-size:1.28rem;line-height:1.5;font-weight:bold;color:var(--navy);margin-bottom:18px}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 15px;min-height:56px;font:1.05rem/1.4 Georgia,serif;color:var(--ink);background:#fffaf0;border:2px solid #c9b98c;border-radius:12px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--gold);background:#fff4d6}
.opt .ltr{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;background:var(--navy);color:var(--gold2)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--bluebg);border-color:var(--blue);color:#0e2c6b;font-weight:bold}
.opt.correct .ltr{background:var(--blue);color:#fff}
.opt.wrong{background:var(--redbg);border-color:var(--red);color:#7a1610;font-weight:bold;animation:shake .4s}
.opt.wrong .ltr{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:18px;padding:14px 16px;border-radius:12px;border-left:6px solid;line-height:1.5}
.fb.show{display:block;animation:rise .35s}
.fb.good{background:var(--bluebg);border-color:var(--blue);color:#0e2c6b}
.fb.bad{background:var(--redbg);border-color:var(--red);color:#6e1510}
.fb b{display:block;font-size:1.1rem;margin-bottom:4px}
#nextBtn{display:none}
#nextBtn.show{display:block}
.ring{width:170px;height:170px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--red) 0);position:relative}
.ring::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--parch)}
.ring span{position:relative;z-index:1;font-size:2.3rem;font-weight:bold;color:var(--navy)}
.msg{text-align:center;font-size:1.15rem;font-style:italic;margin-top:8px;color:#3a3f58}
.final{text-align:center;font-size:1.2rem;margin-top:8px;color:var(--navy)}
@media(max-width:520px){h1{font-size:1.6rem}.qtext{font-size:1.15rem}.card{padding:20px 15px}}
</style>
</head>

<script>
var QUESTIONS = [
{t:"tf",q:"The judiciary is responsible for interpreting laws and administering justice.",a:true,e:"Interpreting laws and administering justice is the core role of the judiciary."},
{t:"tf",q:"The U.S. Supreme Court is located in Washington, D.C., and its decisions are final.",a:true,e:"The Supreme Court sits in Washington, D.C., and is the final authority in the U.S. court system."},
{t:"tf",q:"Federal appellate courts are present in every U.S. state.",a:false,e:"Federal appellate courts are not found in every state."},
{t:"tf",q:"State court judges may be elected by the public or appointed by the state governor.",a:true,e:"Depending on the state, judges are either elected by voters or appointed by the governor."},
{t:"tf",q:"Federal court judges are nominated by the U.S. President and must be confirmed or appointed by the Senate.",a:true,e:"The President nominates federal judges, and the Senate confirms them."},
{t:"tf",q:"The U.S. Constitution explicitly grants the Supreme Court the power of judicial review.",a:false,e:"The Constitution does not explicitly grant judicial review; the Supreme Court recognized this power itself."},
{t:"tf",q:"The power of judicial review was recognized by the Supreme Court in Marbury v. Madison in 1803.",a:true,e:"Marbury v. Madison (1803) is the case in which judicial review was recognized."},
{t:"tf",q:"Most cases reach the Supreme Court through its original jurisdiction.",a:false,e:"Most cases arrive through the Court's appellate jurisdiction, not original jurisdiction."},
{t:"tf",q:"Under the Rule of Four, at least four of the nine sitting justices must agree to hear a case or appeal.",a:true,e:"Four of the nine justices are enough to grant review of a case."},
{t:"tf",q:"The Supreme Court may issue advisory opinions when a person does not understand a constitutional provision.",a:false,e:"Courts decide real cases and controversies; they do not issue advisory opinions."},
{t:"tf",q:"Ripeness requires that a case be ready for judicial decision and involve actual harm or a real and immediate danger.",a:true,e:"A ripe case is ready for decision and involves actual harm or an immediate threat."},
{t:"tf",q:"A case remains justiciable even if the underlying dispute has been completely resolved.",a:false,e:"Once the dispute is fully resolved, the case is moot and no longer justiciable."},
{t:"tf",q:"Standing requires injury, causation, and redressability.",a:true,e:"These are the three requirements of standing."},
{t:"tf",q:"A person automatically has standing merely because they are a U.S. citizen who believes a government action is unlawful.",a:false,e:"Citizenship and a belief that an action is unlawful are not enough; the three standing requirements must be met."},
{t:"tf",q:"The Eleventh Amendment generally prohibits federal courts from hearing claims brought by a private party or foreign government against a state government.",a:true,e:"The Eleventh Amendment generally bars such suits against a state in federal court."},

{t:"mc",q:"Which court is the highest court in the United States?",o:["Federal District Court","State Supreme Court","U.S. Supreme Court","Federal Court of Appeals"],c:2,e:"The U.S. Supreme Court is the nation's highest court."},
{t:"mc",q:"Which courts primarily handle cases involving state law questions?",o:["State Courts","Federal Courts","Tax Courts","Supreme Court only"],c:0,e:"State courts primarily handle questions of state law."},
{t:"mc",q:"Who nominates federal court judges?",o:["Congress","The U.S. President","State governors","The Supreme Court"],c:1,e:"The President nominates federal judges, subject to Senate confirmation."},
{t:"mc",q:"Federal judicial power under Article III extends to which of the following?",o:["Interpretation of the Constitution","Federal laws and treaties","Admiralty and maritime laws","All of the above"],c:3,keep:true,e:"Article III covers the Constitution, federal laws and treaties, and admiralty and maritime law."},
{t:"mc",q:"The Supreme Court's power to determine whether government actions comply with the Constitution is called:",o:["Original jurisdiction","Judicial review","Standing","Mootness"],c:1,e:"Judicial review is the power to assess whether government actions are constitutional."},
{t:"mc",q:"Which case is associated with the recognition of judicial review by the Supreme Court?",o:["Marbury v. Madison","Brown v. Board of Education","Roe v. Wade","Miranda v. Arizona"],c:0,e:"Marbury v. Madison (1803) established judicial review."},
{t:"mc",q:"Which of the following falls within the Supreme Court's original jurisdiction?",o:["Every criminal case","Cases affecting ambassadors","Every state-law case","All cases from federal courts of appeals"],c:1,e:"Cases affecting ambassadors fall under the Court's original jurisdiction."},
{t:"mc",q:"Most Supreme Court cases reach the Court through:",o:["Original jurisdiction","Presidential referral","Appellate jurisdiction","State governors"],c:2,e:"The vast majority of cases come through appellate jurisdiction."},
{t:"mc",q:"Under a writ of certiorari, the Supreme Court:",o:["Must hear every case","Has complete discretion to hear the case","Can only hear criminal cases","Can only hear cases between states"],c:1,e:"Certiorari gives the Court full discretion over whether to take a case."},
{t:"mc",q:"What is required under the Rule of Four?",o:["Four states must bring the case","Four judges must decide the case","At least four of the nine justices must agree to hear the case","Four lower courts must review the case first"],c:2,e:"Four of the nine justices must vote to hear a case."},
{t:"mc",q:"A law has not yet been enforced and has caused no actual harm. Which doctrine would most directly prevent a challenge?",o:["Mootness","Ripeness","Redressability","Sovereign immunity"],c:1,e:"Without actual harm or immediate danger, the case is not ripe."},
{t:"mc",q:"If a challenged law is canceled before the court issues its decision and the controversy ends, the case generally becomes:",o:["Ripe","Appellate","Moot","Political"],c:2,e:"When the controversy ends before decision, the case is moot."},
{t:"mc",q:"Which of the following is NOT one of the three requirements of standing?",o:["Injury","Causation","Redressability","Judicial review"],c:3,e:"Standing requires injury, causation, and redressability; judicial review is a different concept."},
{t:"mc",q:"A matter constitutionally committed to another branch of government or inherently incapable of judicial resolution is generally considered:",o:["A class action","A political question","An advisory opinion","An appellate claim"],c:1,e:"Such matters are political questions, which courts generally do not decide."},
{t:"mc",q:"Which action is NOT generally barred by the Eleventh Amendment?",o:["A private party's claim against a state government","A foreign government's claim against a state government","An action against a local government","A suit against a state requiring retroactive damages"],c:2,e:"The Eleventh Amendment protects state governments, not local governments."}

    b.appendChild(l);b.appendChild(s);b._ok=it.ok;
    b.onclick=function(){pick(b,q);};
    box.appendChild(b);
  });
}

function pick(btn,q){
  if(answered)return;answered=true;
  var ok=btn._ok;if(ok){score++;$("sc").textContent=score;}
  Array.prototype.forEach.call($("opts").children,function(b){
    b.disabled=true;
    if(b._ok)b.classList.add("correct");
    else if(b===btn)b.classList.add("wrong");
    else b.classList.add("dim");
  });
  var fb=$("fb");fb.className="fb show "+(ok?"good":"bad");
  fb.innerHTML="<b>"+(ok?"Correct!":"Incorrect")+"</b>";
  var p=document.createElement("span");p.textContent=q.e;fb.appendChild(p);
  $("nextBtn").className="btn show";
}

function next(){
  if(!answered)return;
  idx++;
  if(idx>=TOTAL)finish();else render();
}

function finish(){
  var pct=Math.round(score/TOTAL*100);
  $("ring").style.setProperty("--p",pct);
  $("pct").textContent=pct+"%";
  $("fin").textContent=score+" / "+TOTAL;
  $("msg").textContent=pct>=90?"Outstanding work!":pct>=75?"Very well done!":pct>=50?"Good effort. Keep practicing!":"Review the topics and try again!";
  show("result");
}

$("startBtn").onclick=start;
$("nextBtn").onclick=next;
$("restartBtn").onclick=start;
</script>
</body>
</html>
