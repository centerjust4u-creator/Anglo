<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anglo Quiz 1</title>
<style>
  :root{
    --navy:#0b1830;
    --navy-2:#132447;
    --parchment:#f6efdd;
    --parchment-2:#efe4c8;
    --gold:#c9a24b;
    --gold-2:#e8c873;
    --ink:#22200f;
    --blue:#1f6fd6;
    --red:#c0392b;
    --green-ok:#1f6fd6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(circle at 20% 10%, var(--navy-2), var(--navy) 70%);
    font-family:Georgia,'Times New Roman',serif;
    color:var(--parchment);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .app{
    width:100%;
    max-width:700px;
  }
  .brand{
    text-align:center;
    margin-bottom:18px;
  }
  .brand-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(180deg,var(--navy-2),var(--navy));
    border:2px solid var(--gold);
    border-radius:999px;
    padding:8px 20px;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .brand-badge span{
    font-weight:bold;
    letter-spacing:1px;
    color:var(--gold-2);
    font-size:14px;
    text-transform:uppercase;
  }
  .header-logo{
    display:block;
    margin:0 auto 12px;
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 6px 18px rgba(0,0,0,0.5);
    border:3px solid var(--gold);
  }
  .card{
    background:linear-gradient(180deg,var(--parchment),var(--parchment-2));
    color:var(--ink);
    border-radius:16px;
    border:3px solid var(--gold);
    box-shadow:0 12px 30px rgba(0,0,0,0.45);
    padding:28px 26px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    border:1px solid rgba(201,162,75,0.4);
    margin:6px;
    border-radius:10px;
    pointer-events:none;
  }
  h1{
    font-size:1.5rem;
    margin:0 0 6px;
    text-align:center;
    color:var(--navy);
  }
  .subtitle{
    text-align:center;
    font-style:italic;
    color:#4a4626;
    margin-bottom:18px;
  }
  .brand-line{
    text-align:center;
    font-size:0.85rem;
    color:#4a4626;
    margin:0 0 10px;
    letter-spacing:0.3px;
  }
  .stats-row{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin:16px 0 22px;
  }
  .stat-pill{
    background:var(--navy);
    color:var(--gold-2);
    border-radius:999px;
    padding:6px 14px;
    font-size:0.85rem;
    border:1px solid var(--gold);
  }
  .btn{
    display:inline-block;
    font-family:inherit;
    font-size:1.05rem;
    font-weight:bold;
    padding:14px 28px;
    border-radius:10px;
    border:2px solid var(--gold);
    background:linear-gradient(180deg,var(--navy-2),var(--navy));
    color:var(--gold-2);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    width:100%;
    text-align:center;
  }
  .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(0,0,0,0.35);
  }
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-secondary{
    background:transparent;
    color:var(--navy);
    border-color:var(--navy);
  }
  .progress-wrap{
    margin-bottom:14px;
  }
  .progress-bar-bg{
    height:8px;
    width:100%;
    background:rgba(0,0,0,0.15);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),var(--gold-2));
    transition:width .25s ease;
  }
  .progress-labels{
    display:flex;
    justify-content:space-between;
    font-size:0.8rem;
    margin-top:6px;
    color:#4a4626;
  }
  .question-text{
    font-size:1.15rem;
    line-height:1.5;
    margin:14px 0 20px;
    font-weight:bold;
    color:var(--navy);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option{
    text-align:left;
    padding:14px 16px;
    border-radius:10px;
    border:2px solid rgba(11,24,48,0.25);
    background:#fffdf6;
    color:var(--ink);
    font-family:inherit;
    font-size:1rem;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .option:hover:not(:disabled){
    border-color:var(--gold);
    background:#fff8e6;
  }
  .option:disabled{cursor:default;}
  .option.selected-correct{
    background:rgba(31,111,214,0.15);
    border-color:var(--blue);
    color:#0d3a75;
    font-weight:bold;
  }
  .option.selected-incorrect{
    background:rgba(192,57,43,0.15);
    border-color:var(--red);
    color:#7a1f16;
    font-weight:bold;
  }
  .option.reveal-correct{
    background:rgba(31,111,214,0.15);
    border-color:var(--blue);
    color:#0d3a75;
    font-weight:bold;
  }
  .feedback{
    margin-top:18px;
    padding:14px 16px;
    border-radius:10px;
    font-size:0.98rem;
    line-height:1.5;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.correct{
    background:rgba(31,111,214,0.12);
    border:1px solid var(--blue);
    color:#0d3a75;
  }
  .feedback.incorrect{
    background:rgba(192,57,43,0.12);
    border:1px solid var(--red);
    color:#7a1f16;
  }
  .feedback strong{display:block;margin-bottom:4px;font-size:1rem;}
  .nav-row{
    margin-top:22px;
    display:flex;
    justify-content:flex-end;
  }
  .nav-row .btn{width:auto;padding:12px 26px;}
  .center-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    text-align:center;
  }
  .score-big{
    font-size:2.6rem;
    font-weight:bold;
    color:var(--navy);
  }
  .score-sub{
    font-size:1rem;
    color:#4a4626;
  }
  .footer-note{
    text-align:center;
    color:rgba(246,239,221,0.55);
    font-size:0.75rem;
    margin-top:16px;
  }

  .logo-img{
    display:block;
    margin:0 auto;
  }
  .brand-badge img{
    height:32px;
    width:32px;
    border-radius:50%;
    object-fit:cover;
  }
  .start-logo{
    width:88px;
    height:88px;
    border-radius:50%;
    object-fit:cover;
    margin:0 auto 12px;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
    border:3px solid var(--gold);
  }
  .results-logo{
    width:70px;
    height:70px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:4px;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    border:3px solid var(--gold);
  }
  .hidden{display:none !important;}
  @media (max-width:480px){
    .card{padding:20px 16px;}
    h1{font-size:1.25rem;}
    .question-text{font-size:1.05rem;}
  }
</style>
</head>

    {type:"mc", q:"The U.S. Supreme Court consists of the Chief Justice in addition to how many other justices?", options:["6","7","8","9"], correct:2,
     explain:"The Supreme Court consists of the Chief Justice in addition to 8 justices."},

    {type:"mc", q:"What is the primary role of the U.S. Judiciary Branch?", options:["To write statutes","To execute laws","To interpret laws and establish judicial precedents","To appoint ministers"], correct:2,
     explain:"The Judiciary's primary role is to interpret laws and establish judicial precedents, the primary source of law in the common law system."},

    {type:"mc", q:"Which political party is associated with figures like John F. Kennedy, Bill Clinton, and Barack Obama?", options:["Republican Party","Democratic Party","Libertarian Party","Green Party"], correct:1,
     explain:"The Democratic Party is associated with John F. Kennedy, Bill Clinton, and Barack Obama."},

    {type:"mc", q:"The Republican Party, associated with figures like Donald Trump and Ronald Reagan, is generally associated with which type of policies?", options:["More liberal policies","More conservative policies","Socialist policies","No political ideology"], correct:1,
     explain:"The Republican Party is generally associated with more conservative policies."}
  ];

  var order = [];
  var current = 0;
  var score = 0;
  var answered = false;

  var elStart = document.getElementById('screen-start');
  var elQuiz = document.getElementById('screen-quiz');
  var elResults = document.getElementById('screen-results');

  var totalMC = questions.filter(function(q){return q.type==='mc';}).length;
  var totalTF = questions.filter(function(q){return q.type==='tf';}).length;

  document.getElementById('quiz-title').textContent = QUIZ_TITLE;
  document.getElementById('stat-total').textContent = questions.length + ' Questions';
  document.getElementById('stat-mc').textContent = totalMC + ' Multiple Choice';
  document.getElementById('stat-tf').textContent = totalTF + ' True/False';

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }

  function startQuiz(){
    order = shuffle(questions.map(function(_,i){return i;}));
    current = 0;
    score = 0;
    answered = false;
    elStart.classList.add('hidden');
    elResults.classList.add('hidden');
    elQuiz.classList.remove('hidden');
    renderQuestion();
  }

  function renderQuestion(){
    answered = false;
    var qIndex = order[current];
    var q = questions[qIndex];

    var pct = Math.round((current)/order.length*100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-text').textContent = 'Question ' + (current+1) + ' of ' + order.length;
    document.getElementById('score-text').textContent = 'Correct: ' + score;

    document.getElementById('question-text').textContent = q.q;

    var optsWrap = document.getElementById('options');
    optsWrap.innerHTML = '';
    q.options.forEach(function(optText, idx){
      var btn = document.createElement('button');
      btn.className = 'option';
      btn.type = 'button';
      btn.textContent = optText;
      btn.addEventListener('click', function(){ selectAnswer(idx); });
      optsWrap.appendChild(btn);
    });

    var fb = document.getElementById('feedback');
    fb.className = 'feedback';
    fb.innerHTML = '';

    var nextBtn = document.getElementById('btn-next');
    nextBtn.disabled = true;
    nextBtn.textContent = (current === order.length-1) ? 'See results' : 'Next question';
  }

  function selectAnswer(idx){
    if(answered) return;
    answered = true;

    var qIndex = order[current];
    var q = questions[qIndex];
    var isCorrect = (idx === q.correct);
    if(isCorrect) score++;

    var optsWrap = document.getElementById('options');
    var optionEls = optsWrap.querySelectorAll('.option');
    optionEls.forEach(function(el, i){
      el.disabled = true;
      if(i === q.correct){
        el.classList.add('reveal-correct');
      }
      if(i === idx && !isCorrect){
        el.classList.add('selected-incorrect');
      }
      if(i === idx && isCorrect){
        el.classList.add('selected-correct');
      }
    });

    var fb = document.getElementById('feedback');
    fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'incorrect');
    fb.innerHTML = '<strong>' + (isCorrect ? 'Correct!' : 'Not quite.') + '</strong>' + q.explain;

    document.getElementById('score-text').textContent = 'Correct: ' + score;
    document.getElementById('btn-next').disabled = false;
  }

  function nextQuestion(){
    if(!answered) return;
    current++;
    if(current >= order.length){
      showResults();
    } else {
      renderQuestion();
    }
  }

  function showResults(){
    document.getElementById('progress-fill').style.width = '100%';
    elQuiz.classList.add('hidden');
    elResults.classList.remove('hidden');
    document.getElementById('final-score').textContent = score + ' / ' + order.length;
  }

  document.getElementById('btn-start').addEventListener('click', startQuiz);
  document.getElementById('btn-next').addEventListener('click', nextQuestion);
  document.getElementById('btn-restart').addEventListener('click', startQuiz);

})();
</script>
</body>
</html>
