<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anglo Quiz 6 · Center JUST</title>
<style>
:root{--navy:#060E24;--ink:#0B1633;--gold:#D6B158;--gold2:#F0D99A;--parch:#F6EFDC;--parch2:#EADFC0;--text:#2A2418;--blue:#2454BE;--ok:#2454BE;--bad:#C93636;--mut:#A9B6D3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;color:#F4F7FC;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 85% -10%,rgba(36,84,190,.28),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(214,177,88,.08),transparent 60%),radial-gradient(ellipse at center,#0A1634 0%,#060E24 55%,#030816 100%)}
.serif{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid rgba(214,177,88,.55)}
header img{width:42px;height:42px;object-fit:contain}
header .brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
header .lbl{margin-left:auto;font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
#bar{height:3px;background:rgba(214,177,88,.15)}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#B8913A,var(--gold2));transition:width .5s ease}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:24px 16px 32px}
.screen{display:none;animation:rise .5s ease both}.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.panel{background:rgba(14,26,58,.72);border:1px solid rgba(214,177,88,.5);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03);padding:28px 22px;backdrop-filter:blur(6px)}
.center{text-align:center}
.hero img{width:170px;max-width:48vw;filter:drop-shadow(0 8px 24px rgba(214,177,88,.25));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.hero .wm{font-family:Georgia,serif;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:22px;margin:10px 0 2px}
.pres{font-size:11px;letter-spacing:.3em;color:var(--mut);margin-top:18px}
h1{font-family:Georgia,serif;font-size:clamp(30px,7vw,46px);margin:8px 0 10px;font-weight:700;color:#fff}
.rule{width:80px;height:2px;background:var(--gold);margin:12px auto;border-radius:2px}
.sub{color:var(--mut);font-size:16px;line-height:1.5;max-width:460px;margin:0 auto 18px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 22px}
.chip{border:1px solid rgba(214,177,88,.6);color:var(--gold2);border-radius:999px;padding:7px 14px;font-size:13px;letter-spacing:.05em;background:rgba(214,177,88,.07)}
.btn{font:inherit;font-weight:700;letter-spacing:.06em;border:0;border-radius:12px;padding:15px 30px;min-height:52px;cursor:pointer;color:#1b1405;background:linear-gradient(180deg,#F0D99A,#D6B158 55%,#B8913A);box-shadow:0 6px 20px rgba(214,177,88,.3);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(214,177,88,.42)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;gap:10px}
.qhead b{color:#fff}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--text);border-radius:16px;border:2px solid var(--gold);box-shadow:0 14px 44px rgba(0,0,0,.55);padding:26px 22px}
.tag{display:inline-block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#7a5d1b;border:1px solid #b8913a;border-radius:999px;padding:3px 10px;margin-bottom:12px}
.q{font-family:Georgia,serif;font-size:clamp(19px,4.6vw,25px);line-height:1.4;margin:0 0 20px;font-weight:700;color:#1a1608}
.opts{display:grid;gap:11px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;font:inherit;font-size:16px;line-height:1.35;color:#231d0e;background:#FFFBEF;border:2px solid #cfbd8a;border-radius:12px;padding:13px 14px;min-height:56px;cursor:pointer;transition:transform .15s,border-color .15s,background .2s,opacity .3s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:#B8913A;background:#fff}
.opt .b{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#0B1633;color:var(--gold);font-weight:700;font-family:Georgia,serif}
.opt:disabled{cursor:default}
.opt.right{background:var(--blue);border-color:#173a86;color:#fff;animation:pop .4s}
.opt.right .b{background:#fff;color:var(--blue)}
.opt.wrong{background:var(--bad);border-color:#8d1f1f;color:#fff;animation:shake .4s}
.opt.wrong .b{background:#fff;color:var(--bad)}
.opt.fade{opacity:.45}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fb{display:none;margin-top:18px;border-radius:12px;padding:14px 16px;line-height:1.5;font-size:15px}
.fb.on{display:block;animation:rise .35s both}
.fb.ok{background:rgba(36,84,190,.12);border-left:5px solid var(--blue);color:#12275a}
.fb.no{background:rgba(201,54,54,.1);border-left:5px solid var(--bad);color:#5a1414}
.fb strong{display:block;font-family:Georgia,serif;font-size:18px;margin-bottom:4px}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px;min-height:0}
.big{font-family:Georgia,serif;font-size:clamp(64px,18vw,104px);color:var(--gold);line-height:1;margin:6px 0}
.msg{font-family:Georgia,serif;font-size:22px;margin:6px 0 4px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
footer{text-align:center;padding:16px;font-size:12px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase;border-top:1px solid rgba(214,177,88,.2)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
@media(max-width:520px){header .brand{font-size:16px}header .lbl{font-size:10px;letter-spacing:.12em}.panel{padding:22px 14px}.card{padding:20px 14px}}
</style>
</head>

<script>
var QUESTIONS=[{"type": "tf", "q": "The U.S. Congress consists of two houses: the House of Representatives and the Senate.", "answer": true, "exp": "Congress is bicameral, made up of the House of Representatives and the Senate."}, {"type": "tf", "q": "Members of the U.S. Congress are appointed by the President rather than directly elected by the people.", "answer": false, "exp": "Members of Congress are directly elected by the people, not appointed by the President."}, {"type": "tf", "q": "Implied powers are powers not expressly stated in the Constitution but considered necessary to carry out enumerated powers.", "answer": true, "exp": "Implied powers are not written out in the Constitution but are necessary to carry out the enumerated powers."}, {"type": "tf", "q": "The President has the exclusive constitutional authority to impose taxes on individuals and corporations.", "answer": false, "exp": "The taxing power belongs to Congress, not exclusively to the President."}, {"type": "tf", "q": "Congress may regulate economic activities conducted entirely within one state if those activities, considered in the aggregate, substantially affect interstate commerce.", "answer": true, "exp": "Under the Commerce Clause, purely intrastate economic activity may be regulated when, in the aggregate, it substantially affects interstate commerce."}, {"type": "tf", "q": "The President may declare war independently without congressional approval because the President is Commander-in-Chief.", "answer": false, "exp": "Declaring war is a power reserved to Congress; being Commander-in-Chief does not let the President declare war alone."}, {"type": "tf", "q": "Congress possesses general police power throughout the United States, including all areas governed by state law.", "answer": false, "exp": "Congress has no general police power; its police powers are specific, such as over the District of Columbia and federal military bases."}, {"type": "tf", "q": "The Speech and Debate Clause protects members of Congress from liability for accepting bribes during legislative proceedings.", "answer": false, "exp": "The Speech and Debate Clause does not shield members of Congress from liability for accepting bribes."}, {"type": "tf", "q": "Congress may delegate certain legislative powers to the executive or judicial branch if intelligible standards are established and the powers are not exclusively reserved to Congress.", "answer": true, "exp": "Delegation is permitted when intelligible standards are set and the power is not uniquely reserved to Congress."}, {"type": "tf", "q": "The President may grant pardons for federal offenses, but the pardon power does not extend to impeachment.", "answer": true, "exp": "The pardon power covers federal offenses but not impeachment."}, {"type": "tf", "q": "A presidential veto may be overridden by a simple majority vote in both houses of Congress.", "answer": false, "exp": "A veto override requires more than a simple majority in both houses of Congress."}, {"type": "tf", "q": "If the President takes no action on a bill within ten days while Congress remains in session, the bill becomes law.", "answer": true, "exp": "Presidential inaction for ten days while Congress remains in session lets the bill become law."}, {"type": "tf", "q": "An executive agreement requires approval by two-thirds of the Senate before it becomes effective.", "answer": false, "exp": "Executive agreements do not require two-thirds Senate approval; treaties do."}, {"type": "tf", "q": "When a valid treaty conflicts with a federal statute, the provision adopted later in time prevails.", "answer": true, "exp": "A valid treaty and a federal statute have equal rank, so the later in time prevails."}, {"type": "tf", "q": "Conviction and removal of the President through impeachment require a two-thirds vote in the Senate.", "answer": true, "exp": "The House brings the charges, and the Senate needs a two-thirds vote to convict and remove."}, {"type": "mc", "q": "What is the primary function of the legislative branch of the U.S. government?", "opts": ["Enforcing laws", "Interpreting laws", "Creating laws", "Appointing judges"], "answer": 2, "exp": "The legislative branch exists primarily to create laws."}, {"type": "mc", "q": "Which constitutional clause provides the basis for Congress's implied powers?", "opts": ["Supremacy Clause", "Necessary and Proper Clause", "Speech and Debate Clause", "Due Process Clause"], "answer": 1, "exp": "Implied powers rest on the Necessary and Proper Clause."}, {"type": "mc", "q": "Which of the following is Congress prohibited from taxing?", "opts": ["Individual income", "Corporate profits", "Exports to foreign countries", "Domestic commercial transactions"], "answer": 2, "exp": "Congress may tax income, profits and domestic transactions, but not exports to foreign countries."}, {"type": "mc", "q": "Under the Commerce Clause, Congress may regulate an economic activity occurring entirely within one state when:", "opts": ["The state governor requests federal intervention.", "The activity has a substantial effect on interstate commerce when considered in the aggregate.", "The activity is conducted by a private individual.", "The activity has no connection to interstate commerce."], "answer": 1, "exp": "The test is a substantial effect on interstate commerce when the activity is considered in the aggregate."}, {"type": "mc", "q": "Which of the following activities generally requires factual proof of a substantial economic effect on interstate commerce before Congress can regulate it under the Commerce Clause?", "opts": ["International shipping", "Interstate transportation", "Growing wheat for personal consumption", "Possessing a firearm in a school zone"], "answer": 3, "exp": "Possessing a firearm in a school zone is not itself economic activity, so a substantial effect on interstate commerce must be shown."}, {"type": "mc", "q": "Under which circumstance may an American civilian be tried by a military court under martial law?", "opts": ["Whenever the President declares a national emergency", "When actual warfare forces federal courts to close", "Whenever Congress investigates a civilian", "When a civilian commits an ordinary federal offense"], "answer": 1, "exp": "Military trial of civilians is allowed only when actual warfare forces the federal courts to close."}, {"type": "mc", "q": "Which of the following falls within Congress's specific police powers?", "opts": ["All private property throughout the United States", "Every public school in the country", "The District of Columbia and federal military bases", "All businesses operating within individual states"], "answer": 2, "exp": "Congress's police powers are specific, covering places such as the District of Columbia and federal military bases."}, {"type": "mc", "q": "Which of the following powers cannot be delegated by Congress because it is uniquely reserved to the legislative branch?", "opts": ["Implementing administrative regulations", "Declaring war", "Managing government departments", "Enforcing federal regulations"], "answer": 1, "exp": "Declaring war is reserved to Congress and cannot be delegated."}, {"type": "mc", "q": "Who generally appoints Supreme Court justices, subject to the Senate's advice and consent?", "opts": ["The House of Representatives", "The Chief Justice", "The President", "State governors"], "answer": 2, "exp": "The President appoints justices, with the Senate's advice and consent."}, {"type": "mc", "q": "Which statement correctly describes the President's removal power?", "opts": ["Congress may directly remove Cabinet members without impeachment.", "The President may remove high-level, purely executive officers at will.", "The Senate must approve every removal of an executive officer.", "The President cannot remove any appointed executive officer."], "answer": 1, "exp": "The President may remove high-level, purely executive officers at will."}, {"type": "mc", "q": "What happens S. President?", "opts": ["A two-thirds vote in the House of Representatives is sufficient for removal.", "A majority vote in the Senate initiates impeachment, followed by approval from the Supreme Court.", "A majority vote in the House of Representatives brings impeachment charges, and a two-thirds vote in the Senate is required for conviction and removal.", "The Supreme Court may independently impeach and remove the President."], "answer": 2, "exp": "The House impeaches by majority vote; the Senate convicts and removes by a two-thirds vote."}];
(function(){
var $=function(i){return document.getElementById(i)};
var order,idx,correct,answered;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){['s-start','s-quiz','s-end'].forEach(function(s){$(s).classList.toggle('on',s===id)});window.scrollTo(0,0)}
var nTF=QUESTIONS.filter(function(q){return q.type==='tf'}).length,nMC=QUESTIONS.length-nTF;
$('c-total').textContent=QUESTIONS.length+' Questions';
$('c-tf').textContent=nTF+' True / False';
$('c-mc').textContent=nMC+' Multiple Choice';
function start(){order=shuffle(QUESTIONS);idx=0;correct=0;render();show('s-quiz')}
function render(){
 var q=order[idx];answered=false;
 $('prog').innerHTML='Question <b>'+(idx+1)+'</b> of '+order.length;
 $('score').innerHTML='Correct: <b>'+correct+'</b>';
 $('barfill').style.width=(idx/order.length*100)+'%';
 $('tag').textContent=q.type==='tf'?'True or False':'Multiple Choice';
 $('qtext').textContent=q.q;
 var fb=$('fb');fb.className='fb';fb.innerHTML='';
 $('next').style.display='none';
 var box=$('opts');box.innerHTML='';
 var items=q.type==='tf'?[{t:'True',v:true},{t:'False',v:false}]:shuffle(q.opts.map(function(t,i){return{t:t,v:i}}));
 var ans=q.type==='tf'?q.answer:q.answer;
 items.forEach(function(it,k){
  var b=document.createElement('button');b.className='opt';b.type='button';
  var l=q.type==='tf'?(it.v?'T':'F'):String.fromCharCode(65+k);
  b.innerHTML='<span class="b">'+l+'</span><span></span>';
  b.lastChild.textContent=it.t;
  b._v=it.v;
  b.onclick=function(){pick(b,ans)};
  box.appendChild(b);
 });
 $('qtext').parentNode.style.animation='none';void $('qtext').parentNode.offsetWidth;$('qtext').parentNode.style.animation='rise .4s both';
}
function pick(btn,ans){
 if(answered)return;answered=true;
 var q=order[idx],ok=btn._v===ans,btns=$('opts').children,right;
 for(var i=0;i<btns.length;i++){var b=btns[i];b.disabled=true;if(b._v===ans){right=b;b.classList.add('right')}else if(b!==btn)b.classList.add('fade')}
 if(!ok)btn.classList.add('wrong');else{correct++;burst(btn)}
 $('score').innerHTML='Correct: <b>'+correct+'</b>';
 var fb=$('fb');fb.className='fb on '+(ok?'ok':'no');
 fb.innerHTML='<strong>'+(ok?'Correct!':'Not quite')+'</strong>';
 if(!ok){var d=document.createElement('div');d.textContent='Correct answer: '+right.lastChild.textContent;d.style.marginBottom='6px';fb.appendChild(d)}
 var e=document.createElement('div');e.textContent=q.exp;fb.appendChild(e);
 var n=$('next');n.style.display='';n.textContent=idx===order.length-1?'See result':'Next question';
 setTimeout(function(){n.scrollIntoView({behavior:'smooth',block:'nearest'})},120);
}
function next(){idx++;if(idx>=order.length)finish();else render()}
function finish(){
 $('barfill').style.width='100%';
 var p=Math.round(correct/order.length*100);
 $('pct').textContent=p+'%';
 $('fscore').textContent=correct+' / '+order.length+' correct';
 $('fmsg').textContent=p>=90?'Outstanding work!':p>=70?'Well done — a strong result.':p>=50?'Good effort. Try again to improve.':'Keep practising — you can do better.';
 show('s-end');if(p>=70)confetti();
}
$('start').onclick=start;$('restart').onclick=function(){$('barfill').style.width='0';start()};$('next').onclick=next;
document.addEventListener('keydown',function(e){
 if(!$('s-quiz').classList.contains('on'))return;
 if(e.key==='Enter'&&answered){next();return}
 if(!answered){var k=e.key.toUpperCase(),bs=$('opts').children;
  for(var i=0;i<bs.length;i++){var l=bs[i].firstChild.textContent;if(l===k||(order[idx].type==='tf'&&((k==='1'&&i===0)||(k==='2'&&i===1)))){bs[i].click();break}}}
});
/* light confetti */
var cv=$('fx'),cx=cv.getContext('2d'),P=[],raf;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(el){var r=el.getBoundingClientRect();spawn(r.left+r.width/2,r.top+r.height/2,14,false)}
function confetti(){spawn(innerWidth/2,innerHeight/3,120,true)}
function spawn(x,y,n,big){var c=['#D6B158','#F0D99A','#2454BE','#F4F7FC'];for(var i=0;i<n;i++)P.push({x:x,y:y,vx:(Math.random()-.5)*(big?14:7),vy:(Math.random()-.9)*(big?13:6),s:3+Math.random()*4,c:c[i%4],l:70+Math.random()*40});if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(function(p){return p.l>0});P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l--;cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*1.6)});raf=P.length?requestAnimationFrame(loop):null;if(!raf)cx.clearRect(0,0,cv.width,cv.height)}
})();
</script>
</body>
</html>
