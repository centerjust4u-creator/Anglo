<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anglo Quiz 8 · Center JUST</title>
<style>
:root{--navy:#060E24;--navy2:#0B1838;--gold:#D6B158;--gold2:#a9873a;--parch:#F4ECD8;--parch2:#EADFC2;--ink:#1d2433;--blue:#2454BE;--red:#C93636;--muted:#A9B6D3;--white:#F4F7FC}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--white);background:var(--navy);line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 90% -10%,rgba(36,84,190,.38),transparent 60%),radial-gradient(700px 500px at 0% 110%,rgba(214,177,88,.10),transparent 60%),linear-gradient(180deg,#081230,#050B1D)}
.serif{font-family:Georgia,"Times New Roman",serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid rgba(214,177,88,.5)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:50%}
.brand b{font-family:Georgia,serif;font-size:19px;letter-spacing:.5px;color:var(--gold)}
.tag{font-size:11px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;white-space:nowrap}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:4px;margin:10px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .5s ease}
.screen{display:none;animation:fade .5s ease}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:10px 4px}
.hero img{width:190px;height:190px;border-radius:50%;filter:drop-shadow(0 10px 30px rgba(214,177,88,.35));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.hero .cj{font-family:Georgia,serif;color:var(--gold);font-size:26px;letter-spacing:2px;margin-top:6px}
.hero .pre{font-size:12px;letter-spacing:.3em;color:var(--muted);margin-top:18px}
.hero h1{font-family:Georgia,serif;font-size:42px;margin:6px 0 10px;line-height:1.1}
.rule{width:80px;height:3px;background:var(--gold);margin:12px auto;border-radius:3px}
.hero p{color:var(--muted);max-width:480px;margin:0 auto 18px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.chip{border:1px solid rgba(214,177,88,.55);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--gold);background:rgba(214,177,88,.07)}
.btn{font:inherit;font-weight:700;letter-spacing:.04em;cursor:pointer;border:0;border-radius:12px;padding:15px 30px;min-height:52px;color:#2a1f05;background:linear-gradient(180deg,#e8c973,var(--gold) 60%,var(--gold2));box-shadow:0 6px 20px rgba(214,177,88,.3);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(214,177,88,.45)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.card{background:linear-gradient(180deg,var(--parch),var(--parch2));color:var(--ink);border:2px solid var(--gold);border-radius:16px;padding:22px 20px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.meta{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:#6b5420;margin-bottom:12px}
.q{font-family:Georgia,serif;font-size:21px;line-height:1.4;margin-bottom:18px;font-weight:600}
.kind{display:inline-block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#6b5420;border:1px solid var(--gold2);border-radius:999px;padding:2px 10px;margin-bottom:10px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fffaf0;border:2px solid #cdb67a;border-radius:12px;padding:13px 14px;min-height:56px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--gold2);background:#fff3d6}
.badge{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--navy2);color:var(--gold);font-family:Georgia,serif}
.opt:disabled{cursor:default}
.opt.fade{opacity:.5}
.opt.ok{background:var(--blue);border-color:#14357f;color:#fff;opacity:1;animation:pop .4s}
.opt.ok .badge{background:#fff;color:var(--blue)}
.opt.no{background:var(--red);border-color:#8f2020;color:#fff;opacity:1;animation:shake .4s}
.opt.no .badge{background:#fff;color:var(--red)}
@keyframes pop{50%{transform:scale(1.025)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.on{display:block;animation:fade .3s}
.fb.good{background:rgba(36,84,190,.14);border:1px solid var(--blue);color:#173a85}
.fb.bad{background:rgba(201,54,54,.12);border:1px solid var(--red);color:#8f2020}
.nextrow{display:flex;justify-content:flex-end;margin-top:16px;min-height:52px}
.nextrow .btn{display:none}.nextrow .btn.on{display:block}
.res{text-align:center}
.res .pct{font-family:Georgia,serif;font-size:76px;color:var(--gold);line-height:1}
.res .sc{font-size:20px;margin:6px 0 4px}
.res .msg{color:var(--muted);margin-bottom:18px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 26px}
.rev{text-align:left;display:grid;gap:10px}
.ri{background:rgba(255,255,255,.05);border:1px solid rgba(214,177,88,.3);border-left:5px solid var(--blue);border-radius:12px;padding:12px 14px;font-size:15px}
.ri.w{border-left-color:var(--red)}
.ri small{display:block;color:var(--muted);margin-top:4px}
.ri .c{color:#8fb2ff}.ri .x{color:#ff9a9a}
footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.12em;margin-top:30px}
@media(max-width:520px){.hero h1{font-size:34px}.q{font-size:19px}.tag{font-size:10px}.hero img{width:150px;height:150px}}
</style>
</head>

 restricting speech may be unconstitutional when:", "o": ["It provides clear standards for enforcement", "It regulates only the location of speech", "It fails to provide reasonable notice of prohibited conduct", "It applies equally to all citizens"], "a": 2}, {"type": "mc", "q": "If a licensing statute gives officials unlimited discretion to approve or reject speech permits, which statement is correct?", "o": ["Speakers must always obtain permission before challenging the statute.", "The statute is automatically valid because officials represent the government.", "The statute may be invalid on its face, and speakers need not apply for a permit.", "Officials may reject applications without providing any legal standards."], "a": 2}, {"type": "mc", "q": "Which of the following is an example of symbolic expression protected by freedom of speech?", "o": ["Wearing a black armband to protest a war", "Refusing to pay all government taxes", "Threatening a public official with violence", "Physically attacking someone during a demonstration"], "a": 0}, {"type": "mc", "q": "Which statement best describes the distinction between government-funded speech and compelled support for private political messages?", "o": ["The government cannot use taxes to communicate controversial messages.", "Individuals must financially support every political position adopted by private associations.", "The government may use tax revenue to communicate its messages, but individuals generally cannot be compelled to subsidize private political views they oppose.", "All compulsory financial contributions are unconstitutional."], "a": 2}, {"type": "mc", "q": "Which of the following is the best example of a designated public forum?", "o": ["A public sidewalk traditionally used for demonstrations", "A public park historically open to political gatherings", "A government schoolroom opened for community meetings after school hours", "A private residence owned by an individual"], "a": 2}, {"type": "mc", "q": "Which combination of requirements must a reasonable time, place, and manner regulation generally satisfy in public forums?", "o": ["It must favor government opinions and prohibit opposing messages.", "It must be content-neutral, narrowly tailored to serve a significant government interest, and leave open alternative channels of communication.", "It must completely prohibit demonstrations during working hours.", "It must allow government officials unlimited discretion over public expression."], "a": 1}, {"type": "mc", "q": "A speaker urges a crowd to immediately attack a government building. Which category of unprotected speech is most directly involved?", "o": ["Symbolic expression", "Compelled speech", "Incitement to imminent lawless action", "Peaceful assembly"], "a": 2}, {"type": "mc", "q": "Which statement concerning fighting words is most accurate?", "o": ["Every offensive statement is automatically unprotected.", "Personally abusive words provoking immediate physical retaliation may be restricted, but laws selectively punishing particular viewpoints are constitutionally problematic.", "Fighting words are always protected regardless of their consequences.", "The government may prohibit any criticism that causes emotional discomfort."], "a": 1}, {"type": "mc", "q": "Under the constitutional test for obscenity, which of the following factors is relevant when determining whether material lacks constitutional protection?", "o": ["Whether the material criticizes government policies", "Whether the material is unpopular among politicians", "Whether the material lacks serious literary, artistic, political, or scientific value", "Whether the material is distributed without government financial assistance"], "a": 2}, {"type": "mc", "q": "A city adopts a zoning law limiting the locations of adult entertainment establishments to reduce crime and declining property values. Which statement best reflects the constitutional principle governing such regulations?", "o": ["The var L = ["A","B","C","D"];
var $ = function(id){return document.getElementById(id)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var deck=[],idx=0,correct=0,locked=false,missed=[],log=[];
function show(id){["s-start","s-quiz","s-res"].forEach(function(s){$(s).classList.toggle("on",s===id)});window.scrollTo(0,0)}
var ntf=BANK.filter(function(q){return q.type==="tf"}).length;
$("c-total").textContent=BANK.length+" Questions";
$("c-tf").textContent=ntf+" True / False";
$("c-mc").textContent=(BANK.length-ntf)+" Multiple Choice";
function begin(list){
  deck=shuffle(list).map(function(q){
    if(q.type==="mc"){var o=shuffle(q.o.map(function(t,i){return{t:t,c:i===q.a}}));return{type:"mc",q:q.q,opts:o,src:q.src}}
    return q;
  });
  idx=0;correct=0;missed=[];log=[];show("s-quiz");render();
}
function render(){
  var q=deck[idx];locked=false;
  $("prog").textContent="Question "+(idx+1)+" of "+deck.length;
  $("score").textContent=correct+" correct";
  $("pb").style.width=(idx/deck.length*100)+"%";
  $("kind").textContent=q.type==="tf"?"True or False":"Multiple Choice";
  $("qt").textContent=q.q;
  var box=$("opts");box.innerHTML="";
  var items=q.type==="tf"?[{t:"True",c:q.a===true},{t:"False",c:q.a===false}]:q.opts;
  items.forEach(function(o,i){
    var b=document.createElement("button");b.className="opt";b.type="button";
    var s=document.createElement("span");s.className="badge";s.textContent=q.type==="tf"?(i===0?"T":"F"):L[i];
    var t=document.createElement("span");t.textContent=o.t;
    b.appendChild(s);b.appendChild(t);b.onclick=function(){answer(i,items)};box.appendChild(b);
  });
  $("fb").className="fb";$("next").className="btn";
  $("next").textContent=idx===deck.length-1?"See result":"Next question";
}
function answer(i,items){
  if(locked)return;locked=true;
  var q=deck[idx],btns=$("opts").children,ci=items.findIndex(function(o){return o.c});
  var ok=items[i].c;
  for(var k=0;k<btns.length;k++){btns[k].disabled=true;
    if(k===ci)btns[k].classList.add("ok");else if(k===i)btns[k].classList.add("no");else btns[k].classList.add("fade");}
  if(ok)correct++;else missed.push(q.src);
  log.push({q:q.q,ok:ok,mine:items[i].t,right:items[ci].t});
  $("score").textContent=correct+" correct";
  var fb=$("fb");fb.className="fb on "+(ok?"good":"bad");
  fb.textContent=ok?"Correct!":"Not quite. Correct answer: "+(q.type==="mc"?L[ci]+") ":"")+items[ci].t;
  $("pb").style.width=((idx+1)/deck.length*100)+"%";
  $("next").className="btn on";
}
$("next").onclick=function(){if(idx<deck.length-1){idx++;render()}else results()};
function results(){
  var n=deck.length,p=Math.round(correct/n*100);
  $("r-pct").textContent=p+"%";$("r-sc").textContent=correct+" / "+n+" correct";
  $("r-msg").textContent=p===100?"Perfect score. Outstanding!":p>=80?"Excellent work!":p>=60?"Good effort. Keep practicing!":"Keep going. Review and try again!";
  $("retry-w").style.display=missed.length?"":"none";
  var r=$("rev");r.innerHTML="";
  log.forEach(function(e,i){
    var d=document.createElement("div");d.className="ri"+(e.ok?"":" w");
    var h=document.createElement("div");h.textContent=(i+1)+". "+e.q;d.appendChild(h);
    var s=document.createElement("small");
    if(e.ok){s.className="c";s.textContent="Your answer: "+e.mine}
    else{s.innerHTML="";var a=document.createElement("span");a.className="x";a.textContent="Your answer: "+e.mine;var br=document.createElement("br");var b=document.createElement("span");b.className="c";b.textContent="Correct answer: "+e.right;s.appendChild(a);s.appendChild(br);s.appendChild(b)}
    d.appendChild(s);r.appendChild(d);
  });
  $("pb").style.width="100%";show("s-res");
}
BANK.forEach(function(q,i){q.src=i});
$("start").onclick=function(){begin(BANK)};
$("restart").onclick=function(){begin(BANK)};
$("retry-w").onclick=function(){begin(missed.map(function(i){return BANK[i]}))};
document.addEventListener("keydown",function(e){
  if(!$("s-quiz").classList.contains("on"))return;
  var k=e.key.toUpperCase(),bt=$("opts").children;
  if(e.key==="Enter"&&locked){$("next").click();return}
  if(locked)return;
  var q=deck[idx],n=q.type==="tf"?{T:0,F:1}[k]:L.indexOf(k);
  if(n>=0&&n<bt.length)bt[n].click();
});
})();
</script>
